};
      const allowedThemes = ["neo-webring","minimal-zine","cyber-terminal","cozy-scrapbook","facepace","tweetdeck","xtraspecial","instapick","tiktalk"];
      const activeTheme = allowedThemes.includes(profile.theme) && TEMPLATES[profile.theme] ? profile.theme : 'neo-webring';
      const template = TEMPLATES[activeTheme];
      document.body.className = 'theme-' + activeTheme + ' shell-' + template.shell + (template.light ? ' tpl-light' : '') + ' min-h-screen antialiased pb-20';
      applyAppearance(profile.appearance);

      function buildDeepLink(action, targetUrl, title, mediaUrl, category) {
        const params = new URLSearchParams();
        params.set('action', action);
        params.set('targetUrl', String(targetUrl || ''));
        if (title) params.set('title', String(title));

      function getEndorsementsFor(canonicalUrl) {
        return (connections.endorsements || []).filter(e => e.targetCanonicalUrl === canonicalUrl);
      }

      function getCommentsFor(canonicalUrl) {
        const fromEndorsements = getEndorsementsFor(canonicalUrl).filter(e => e.type === 'comment');
        const fromOwn = (items.items || [])
          .filter(i => i.type === 'comment' && i.targetUrl === canonicalUrl)
          .map(i => ({
            authorSiteUrl: profile.siteUrl,
            authorName: profile.displayName,
            commentary: i.commentary,
            sourceItemUrl: i.canonicalUrl,
            createdAt: i.createdAt
          }));
        const seen = new Set();
        return [...fromEndorsements, ...fromOwn].filter(c => {
          if (seen.has(c.sourceItemUrl)) return false;
          seen.add(c.sourceItemUrl);
          return true;
        });
      }

      window.toggleLiveCommentThread = function(containerId, canonicalUrl) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (!el.classList.contains('hidden')) {
          el.classList.add('hidden');
          el.innerHTML = '';
          return;
        }
        el.classList.remove('hidden');
        const cfg = profile.commentConfig || {};
        if (cfg.provider === 'giscus' && cfg.giscusRepo) {
          const script = document.createElement('script');
          script.src = 'https://giscus.app/client.js';
          script.setAttribute('data-repo', cfg.giscusRepo);
          if (cfg.giscusRepoId) script.setAttribute('data-repo-id', cfg.giscusRepoId);
          script.setAttribute('data-category', cfg.giscusCategory || 'General');
          if (cfg.giscusCategoryId) script.setAttribute('data-category-id', cfg.giscusCategoryId);
          script.setAttribute('data-mapping', 'specific');
          script.setAttribute('data-term', canonicalUrl);
          script.setAttribute('data-reactions-enabled', '1');
          script.setAttribute('data-emit-metadata', '0');

          script.async = true;

        } else if (cfg.provider === 'utterances' && cfg.giscusRepo) {

        }

      // Ring bars. Prev / Next / Random are baked in at publish; on click they re-read the ring's
      // hub so removed or hidden sites are skipped, falling back to the baked link on any failure.
      const webringBars = (connections.webrings || []).map((ring, ringIndex) => {
        const count = typeof ring.memberCount === 'number' ? ring.memberCount : 3;
        const homeHref = safeUrl(ring.directoryUrl || ring.hubUrl);
        const single = ring.prevSiteUrl && ring.prevSiteUrl === ring.nextSiteUrl;
        const navLink = (nav, href, label, extra) =>
          '<a href="' + safeUrl(href) + '" data-ring-nav="' + nav + '" data-ring-index="' + ringIndex + '"' + (extra || '') + ' rel="noopener noreferrer" class="hover:underline">' + label + '</a>';
        // Random lands on a member saved at publish (never the hub's JSON), so it still works
        // in the preview and when the hub can't be read
        const rotation = ringRotation(ring);
        const randomHref = rotation[0] || ring.directoryUrl;
        const links = count <= 1
          ? ''
          : single
            ? navLink('next', ring.nextSiteUrl, 'Neighbour →')
            : (ring.prevSiteUrl ? navLink('prev', ring.prevSiteUrl, '← Prev Site') : '') +
              (count > 2 && randomHref
                ? navLink('random', randomHref, 'Random', rotation.length ? ' data-ring-random="' + esc(rotation.join(' ')) + '"' : '')
                : '') +
              (ring.nextSiteUrl ? navLink('next', ring.nextSiteUrl, 'Next Site →') : '');
        return `
        <div class="card-surface rounded-xl px-4 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2">
            <span class="accent-soft px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-semibold">WEBRING</span>

          </div>
        </div>

      }).join('');

      // Hub-supplied addresses are untrusted: absolute https only, no credentials
      function ringSiteUrl(value) {
        try {
          const u = new URL(String(value || ''));
          if (u.protocol !== 'https:' || u.username || u.password) return null;
          return u.origin + u.pathname.replace(/\/+$/, '');
        } catch (e) {
          return null;
        }
      }

      // The other members saved at publish, filtered like hub addresses
      function ringRotation(ring) {
        const me = ringSiteUrl(profile.siteUrl);
        const urls = [];
        (Array.isArray(ring.rotationUrls) ? ring.rotationUrls : []).forEach(function(value) {
          const url = ringSiteUrl(value);
          if (url && url !== me && urls.indexOf(url) === -1) urls.push(url);
        });
        return urls;
      }

      function pickRandom(list) {
        return list.length ? list[Math.floor(Math.random() * list.length)] : null;
      }

      async function fetchRingHub(hubUrl) {
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, 2000);
        try {
          const res = await fetch(hubUrl, { credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store', signal: controller.signal });
          if (!res.ok) return null;
          const text = await res.text();
          if (text.length > 1000000) return null;
          const doc = JSON.parse(text);
          if (!doc || !Array.isArray(doc.members) || doc.status === 'closed') return null;
          return doc;
        } catch (e) {
          return null;
        } finally {
          clearTimeout(timer);
        }
      }

      root.addEventListener('click', async function(ev) {
        const anchor = ev.target && ev.target.closest ? ev.target.closest('a[data-ring-nav]') : null;
        if (!anchor) return;
        const ring = (connections.webrings || [])[Number(anchor.getAttribute('data-ring-index'))];
        const hubUrl = ring ? ringSiteUrl(ring.hubUrl) : null;
        if (!hubUrl) return;
        ev.preventDefault();
        const nav = anchor.getAttribute('data-ring-nav');
        const fallback = anchor.getAttribute('href');
        let target = null;
        const doc = await fetchRingHub(ring.hubUrl);
        if (doc) {
          const me = ringSiteUrl(profile.siteUrl);
          const rotation = [];
          doc.members.forEach(function(m) {
            const url = m ? ringSiteUrl(m.siteUrl) : null;
            if (url && (m.inRotation !== false || url === me) && rotation.indexOf(url) === -1) rotation.push(url);
          });
          const others = rotation.filter(function(u) { return u !== me; });
          const idx = rotation.indexOf(me);
          if (nav === 'random') {
            target = pickRandom(others);
          } else if (idx !== -1 && rotation.length > 1) {
            const step = nav === 'prev' ? -1 : 1;
            target = rotation[(idx + step + rotation.length) % rotation.length];
          }
        }
        if (!target && nav === 'random') target = pickRandom(ringRotation(ring));
        const destination = target || fallback;
        if (destination && destination.charAt(0) !== '#') window.location.assign(destination);
      });

      function renderPhotoCard(photo, album, extraClass) {

      function renderAlbum(album, style) {

      // Albums are posted to the feed unless turned off, and shown as a card unless set to expanded
      const albumPosted = (a) => a.postToFeed !== false;

      const albumPhotoTotal = (a) => (a.photos || []).length;

      const albumPhotosLabel = (a, more) => {

      const albumHref = (a) => a.pageUrl ? safeUrl(a.pageUrl) : '#photos';

      // Cover large on the left, two more photos stacked on the right, "+N" on the last tile
      function albumPeek(album) {

        const cover = albumCover(album);

        const extra = photos.length - 3;
        const tiles = [];
        if (cover) tiles.push('<span class="album-tile album-tile-cover"><img src="' + safeUrl(cover) + '" alt="" loading="lazy" /></span>');
        side.forEach(function(src, i) {

      // Items plus posted albums, newest first. Albums count as posts, so a kind filter without posts leaves them out.
      function timelineEntries(list, kinds, limit) {

      }

      // A post whose title is just its opening Markdown heading shows the heading only
      function titleIsOpeningHeading(item) {
        if (item.type !== 'post') return false;

        return /^#{1,6}\s/.test(first) && markdownToPlainText(first) === item.title;

              </span>

              </div>
            </div>
          </div>

                : action === 'comment' ? 'Comment on' + quoted
                    : action === 'friend' ? 'Add ' + esc(title || 'this site') + ' as a friend'
                        : action === 'join-ring' ? 'Join the' + quoted + ' webring'
                            : 'Open in Webring Studio';
        const isWeb = /^https?:\/\//i.test(target);
        // A post or photo on this page: copy its page link (#post-…, #photo-…), not the JSON address
        const pageBase = /^https?:$/.test(location.protocol)
            ? location.href.split('#')[0]
            : String(ctx.profile.siteUrl || '').replace(/\/?$/, '/');
        let webLink = target;
        const item = (ctx.items || []).find((i) => i.canonicalUrl === target);
        const photoId = Object.keys(photoIndex).find((id) => {
            const entry = photoIndex[id];
            return entry.album.photos[entry.index].canonicalUrl === target;
        });
        if (item)
            webLink = pageBase + '#post-' + encodeURIComponent(item.id);
        else if (photoId)
            webLink = pageBase + '#photo-' + encodeURIComponent(photoId);
        handoffUrl = isWeb ? webLink : '';
        current = null;
        dialog.setAttribute('aria-label', heading.replace(/&[^;]+;/g, ''));
        dialog.innerHTML =
            '<div class="wr-sheet card-surface"><div class="wr-sheet-head"><h2>' + heading + '</h2>' +
                '<button type="button" class="wr-close" data-wr="close" aria-label="Close">✕</button></div>' +
                '<p class="wr-sheet-note">This happens in <strong>Webring Studio</strong>, the free desktop app behind this site. Your browser will ask before opening it; choose <em>Always allow</em>, where offered, to skip that next time.</p>' +
                '<a class="wr-go" data-wr-go href="' + esc(href) + '">Open in Webring Studio</a>' +
                '<label class="wr-sheet-check"><input type="checkbox" data-wr-remember /> Don’t ask again on this site</label>' +
                (isWeb
                    ? '<div class="wr-sheet-alt"><p>No app? ' + (action === 'join-ring' ? 'Copy the ring’s address:' : action === 'friend' ? 'Copy the site’s address:' : 'Copy the link:') + '</p>' +
                        '<div class="wr-sheet-copy"><input type="text" readonly value="' + esc(handoffUrl) + '" aria-label="Link" />' +
                        '<button type="button" data-wr="copy">Copy</button>' +
                        (typeof navigator.share === 'function' && action !== 'join-ring' ? '<button type="button" data-wr="share">Share…</button>' : '') +
                        '</div></div>'
                    : '') +
                '<a class="wr-sheet-about" href="' + safeUrl(ctx.projectUrl) + '" target="_blank" rel="noopener noreferrer">What’s Webring Studio?</a></div>';
        show();
        return true;
    };
    const isHandoffLink = (el) => el && /^webring:/i.test(el.getAttribute('href') || '') && !el.hasAttribute('data-wr-go');
    const maybeHandoff = (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return false;
        const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!isHandoffLink(anchor) || !askFirst())
            return false;
        if (!showHandoff(anchor.getAttribute('href')))
            return false;
        ev.preventDefault();
        if (!opener)
            opener = anchor;
        return true;
    };
    root.addEventListener('click', maybeHandoff);
    const step = (delta) => {
        if (!current)
            return;
        const photos = current.album.photos;
        showPhoto(photos[(current.index + delta + photos.length) % photos.length].id);
    };
    root.addEventListener('click', (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return;
        const target = ev.target && ev.target.closest ? ev.target.closest('[data-lightbox], [data-open-post]') : null;
        if (!target)
            return;
        const opened = target.hasAttribute('data-open-post')
            ? showPost(target.getAttribute('data-open-post'))
            : showPhoto(target.getAttribute('data-photo-id'));
        if (opened) {
            ev.preventDefault();
            opener = target;
        }
    });
    dialog.addEventListener('click', (ev) => {
        if (ev.target === dialog)
            return dialog.close(); // backdrop
        if (maybeHandoff(ev))
            return; // Like / Share in the lightbox or post view
        const go = ev.target && ev.target.closest ? ev.target.closest('[data-wr-go]') : null;
        if (go) {
            const remember = dialog.querySelector('[data-wr-remember]');
            if (remember && remember.checked) {
                try {
                    localStorage.setItem(HANDOFF_KEY, 'direct');
                }
                catch (e) {
                    // private mode: the sheet will simply show again
                }
            }
            setTimeout(() => dialog.close(), 300); // let the browser start the hand-off first
            return;
        }
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-wr]') : null;
        if (!button)
            return;
        const action = button.getAttribute('data-wr');
        if (action === 'close')
            dialog.close();
        else if (action === 'fullscreen')
            toggleFullscreen();
        else if (action === 'copy') {
            const field = dialog.querySelector('.wr-sheet-copy input');
            const done = () => {
                button.textContent = 'Copied ✓';
            };
            const fallback = () => {
                if (!field)
                    return;
                field.select();
                let copied = false;
                try {
                    copied = doc.execCommand('copy');
                }
                catch (e) {
                    copied = false;
                }
                if (copied)
                    done();
                else
                    button.textContent = 'Press Ctrl/⌘+C';
            };
            if (navigator.clipboard && navigator.clipboard.writeText)
                navigator.clipboard.writeText(handoffUrl).then(done, fallback);
            else
                fallback();
        }
        else if (action === 'share') {
            navigator.share({ url: handoffUrl }).catch(() => undefined);
        }
        else
            step(action === 'prev' ? -1 : 1);
    });
    dialog.addEventListener('keydown', (ev) => {
        if (!current)
            return;
        if (ev.key === 'ArrowLeft')
            step(-1);
        else if (ev.key === 'ArrowRight')
            step(1);
        else if (ev.key === 'f' && canFullscreen && !ev.metaKey && !ev.ctrlKey && !ev.altKey)
            toggleFullscreen();
    });
    dialog.addEventListener('dblclick', (ev) => {
        if (current && ev.target && ev.target.closest && ev.target.closest('.wr-stage img'))
            toggleFullscreen();
    });
    doc.addEventListener('fullscreenchange', () => {
        const button = dialog.querySelector('[data-wr="fullscreen"]');
        if (button)
            button.outerHTML = fullscreenButton(!!fullscreenLightbox());
    });
    dialog.addEventListener('touchstart', (ev) => {
        touchX = ev.touches && ev.touches[0] ? ev.touches[0].clientX : null;
    }, { passive: true });
    dialog.addEventListener('touchend', (ev) => {
        const endX = ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientX : null;
        if (current && touchX !== null && endX !== null && Math.abs(endX - touchX) > 50)
            step(endX < touchX ? 1 : -1);
        touchX = null;
    });
    dialog.addEventListener('close', () => {
        if (fullscreenLightbox())
            doc.exitFullscreen().catch(() => undefined);
        current = null;
        dialog.innerHTML = '';
        setHash('');
        if (opener && opener.focus)
            opener.focus();
        opener = null;
    });
    // #post-<id> and #photo-<id> open on load and when the address changes
    const openFromHash = () => {
        const match = /^#(post|photo)-(.+)$/.exec(location.hash || '');
        if (!match)
            return;
        let id = match[2];
        try {
            id = decodeURIComponent(id);
        }
        catch (e) {
            return;
        }
        if (match[1] === 'post')
            showPost(id);
        else
            showPhoto(id);
    };
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
    // Older posts loaded later (archives) can be opened in the post view too
    return {
        addItems: (items) => {
            (items || []).forEach((item) => {
                itemIndex[item.id] = item;
            });
        },
    };
};
      let enhancements = null;
      if (installPageEnhancements && !(profile.appearance && profile.appearance.interactions === 'off')) {
        try {
          enhancements = installPageEnhancements({ root, profile, albums: allAlbums, items: allItems, esc, safeUrl, buildDeepLink, renderItem, projectUrl: "https://github.com/lnsCorey/webring" });
        } catch (err) {
          console.warn('Interactive extras unavailable:', err);
        }
      }

      // Loading an archive month appends its posts in the page's layout
      async function loadArchiveItems(url) {
        const embedded = window.__WEBRING_ARCHIVES__;
        let doc = embedded && Object.prototype.hasOwnProperty.call(embedded, url) ? embedded[url] : null;
        if (!doc && window.location.protocol.startsWith('http')) {
          const res = await fetch('./' + String(url).replace(/^\/+/, ''), { credentials: 'omit', cache: 'no-cache' });
          if (res.ok) doc = await res.json();
        }
        if (!doc || !Array.isArray(doc.items)) throw new Error('Archive unavailable');
        return doc.items.filter(i => i && typeof i.id === 'string' && typeof i.canonicalUrl === 'string');
      }
      root.addEventListener('click', async function(ev) {
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-archive-url]') : null;
        if (!button || button.disabled) return;
        const list = root.querySelector('[data-archive-list]');
        if (!list) return;
        button.disabled = true;
        try {
          const loaded = await loadArchiveItems(button.getAttribute('data-archive-url'));
          loaded.forEach(i => allItems.push(i));
          if (enhancements && enhancements.addItems) enhancements.addItems(loaded);
          const group = document.createElement('div');
          group.className = 'older-month-items mb-8';
          group.innerHTML = '<h3 class="text-lg font-bold mb-3">' + esc(button.getAttribute('data-archive-label')) + '</h3>' +
            '<div class="' + archiveView.wrapClass + '">' + loaded.map(archiveView.renderItem).join('') + '</div>';
          list.appendChild(group);
          button.classList.add('opacity-50');
        } catch (err) {
          button.disabled = false;
          button.setAttribute('title', 'Couldn\'t load this month. Try again.');
        }
      });

      // Initialize any rendered AdSense slots
      if (profile.adsAddon && profile.adsAddon.enabled && typeof window !== 'undefined') {
        const adNodes = root.querySelectorAll('ins.adsbygoogle');
        adNodes.forEach(() => {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {}
        });
      }

      // Optional GA4 Webring interaction click tracking
      if (profile.analyticsAddon && profile.analyticsAddon.enabled && profile.analyticsAddon.trackRingInteractions !== false && typeof window.gtag === 'function') {
        root.addEventListener('click', function(ev) {
          const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href^="webring://"]') : null;
          if (anchor) {
            window.gtag('event', 'webring_interact', {
              href: anchor.getAttribute('href') || ''
            });
          }
        });
      }
    })();
  </script>
